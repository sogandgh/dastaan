<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <circle cx="128" cy="128" r="124" fill="#FFD1BA" stroke="#3D7566" stroke-width="6"/>

  <!-- hair, blown to one side -->
  <ellipse cx="146" cy="118" rx="72" ry="70" fill="#3c2a22"/>
  <ellipse cx="192" cy="140" rx="42" ry="55" fill="#3c2a22" transform="rotate(28 192 140)"/>
  <ellipse cx="206" cy="176" rx="26" ry="36" fill="#55392c" transform="rotate(40 206 176)"/>

  <!-- head -->
  <circle cx="118" cy="128" r="58" fill="#eebd93" stroke="#8a5a34" stroke-width="4"/>

  <!-- bangs -->
