    <circle cx="120" cy="74" r="3.6"/>
    <circle cx="140" cy="78" r="3.4"/>
    <circle cx="156" cy="88" r="3"/>
  </g>

  <!-- face -->
  <circle cx="98" cy="132" r="19" fill="#fff" stroke="#2a1c14" stroke-width="3"/>
  <circle cx="140" cy="132" r="19" fill="#fff" stroke="#2a1c14" stroke-width="3"/>
  <circle cx="102" cy="136" r="8" fill="#2a1c14"/>
  <circle cx="144" cy="136" r="8" fill="#2a1c14"/>
  <circle cx="105" cy="132" r="2.4" fill="#fff"/>
  <circle cx="147" cy="132" r="2.4" fill="#fff"/>

  <ellipse cx="86" cy="150" rx="11" ry="7" fill="#f2998c" opacity="0.55"/>
  <ellipse cx="152" cy="150" rx="11" ry="7" fill="#f2998c" opacity="0.55"/>

  <path d="M 108 164 Q 118 172 128 164" fill="none" stroke="#7a3b2e" stroke-width="4" stroke-linecap="round"/>
