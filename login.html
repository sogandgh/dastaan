<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Dastaan.">
  <meta name="theme-color" content="#F8EDEB">
  <title>Sign in · Dastaan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lily.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-stage">

    <div class="login-hero">
      <h1 class="login-title">Dastaan</h1>
      <p class="login-subtitle">Language lessons and bedtime stories for kids</p>
    </div>

    <div class="login-row">

      <!-- Decorative here — same character, same stage, no tap-to-greet
           since audio isn't part of this page. -->
      <div class="lily-holder" aria-hidden="true">
        <div class="lily-stage">
          <div class="lily" id="lily">
            <div class="hair-side-l"></div>
            <div class="hair-side-r"></div>
            <div class="curl-end-l"></div>
            <div class="curl-end-r"></div>
            <div class="head"></div>
            <div class="hair-cap"></div>
            <div class="curl curl1"></div>
            <div class="curl curl2"></div>
            <div class="curl curl3"></div>
            <div class="curl curl4"></div>
            <div class="curl curl5"></div>
            <div class="curl curl6"></div>
            <div class="eyes">
              <div class="eye1"><div class="pupil"></div><div class="pupil-shine"></div><div class="lid"></div></div>
              <div class="eye2"><div class="pupil"></div><div class="pupil-shine"></div><div class="lid"></div></div>
            </div>
            <div class="brow-l"></div>
            <div class="brow-r"></div>
            <div class="cheek-l"></div>
            <div class="cheek-r"></div>
            <div class="nose"></div>
            <div class="mouth1"></div>
            <div class="mouth2"></div>
            <div class="neck"></div>
            <div class="dress"></div>
            <div class="dress-trim"></div>
            <div class="collar"></div>
            <div class="arm-l-group">
              <div class="sleeve"></div>
              <div class="arm"></div>
              <div class="hand"></div>
            </div>
            <div class="arm-r-group">
              <div class="sleeve"></div>
              <div class="arm"></div>
              <div class="hand"></div>
            </div>
            <div class="leg-l"></div>
            <div class="leg-r"></div>
            <div class="shoe-l"></div>
            <div class="shoe-r"></div>
          </div>
        </div>
      </div>

      <div class="login-panel">
        <div class="login-tabs" role="tablist" aria-label="Sign in or create an account">
          <button class="login-tab is-active" id="tab-signin" role="tab" aria-selected="true" type="button">Sign in</button>
          <button class="login-tab" id="tab-signup" role="tab" aria-selected="false" type="button">Create account</button>
        </div>

        <h2 class="sr-only" id="login-heading">Sign in to your account</h2>

        <form id="login-form" novalidate>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" id="login-email" autocomplete="email" required>
          </label>
          <p class="note error" id="email-error" hidden></p>

          <label class="field">
            <span class="field-label">Password</span>
            <div class="password-field">
              <input type="password" id="login-password" autocomplete="current-password"
                     minlength="8" maxlength="72" required>
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </label>
          <p class="note error" id="password-rules" aria-live="polite" hidden></p>

          <label class="field" id="confirm-field" hidden>
            <span class="field-label">Confirm password</span>
            <input type="password" id="login-confirm" autocomplete="new-password" maxlength="72">
          </label>

          <p class="note" id="login-status" aria-live="polite"></p>

          <button type="submit" class="start-btn" id="login-submit">Sign in</button>
        </form>

        <button type="button" class="forgot-link" id="forgot-link">Forgot your password?</button>
      </div>

    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
